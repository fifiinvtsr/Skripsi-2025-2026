<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sistem Prediksi POS IND</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='template_login/images/logo_pos.png') }}"/>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='template_login/vendor/bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='template_login/fonts/font-awesome-4.7.0/css/font-awesome.min.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='template_login/fonts/iconic/css/material-design-iconic-font.min.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='template_login/vendor/animate/animate.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='template_login/vendor/css-hamburgers/hamburgers.min.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='template_login/vendor/animsition/css/animsition.min.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='template_login/vendor/select2/select2.min.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='template_login/vendor/daterangepicker/daterangepicker.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='template_login/css/util.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='template_login/css/main.css') }}">

    <style>
        /* Override semua style dari main.css */
        html, body {
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }

        .limiter {
            width: 100% !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        .container-login100 {
            width: 100% !important;
            height: 100% !important;
            min-height: 100vh !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 15px !important;
            background-repeat: no-repeat !important;
            background-position: center !important;
            background-size: cover !important;
            position: relative !important;
            overflow: hidden !important;
        }

        /* Blur overlay di atas background */
        .container-login100::before {
            content: "" !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background-color: rgba(0, 0, 0, 0.15) !important;
            backdrop-filter: blur(6px) !important;
            -webkit-backdrop-filter: blur(6px) !important;
            z-index: 1 !important;
        }

        /* Kartu login utama */
        .login-card-new {
            position: relative !important;
            z-index: 10 !important;
            background: #ffffff !important;
            width: 100% !important;
            max-width: 420px !important;
            border-radius: 20px !important;
            border: 5px solid #1B2C5B !important;
            padding: 35px 30px !important;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3) !important;
            animation: cardFadeIn 0.8s ease-out forwards !important;
        }

        @keyframes cardFadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Container logo */
        .login-card-new .login-logos {
            display: flex !important;
            align-items: center !important;
            gap: 18px !important;
            margin-bottom: 30px !important;
        }

        .login-card-new .login-logos img {
            height: 42px !important;
            width: auto !important;
            max-width: 180px !important;
            object-fit: contain !important;
            border-radius: 0 !important;
        }

        /* Judul */
        .login-card-new .login-heading {
            font-family: 'Poppins', sans-serif !important;
            font-size: 26px !important;
            font-weight: 700 !important;
            color: #1a1a1a !important;
            line-height: 1.35 !important;
            margin-bottom: 35px !important;
            text-align: left !important;
            letter-spacing: -0.3px !important;
        }

        /* Input group */
        .login-card-new .input-row {
            display: flex !important;
            align-items: center !important;
            border: 1.5px solid #d9d9d9 !important;
            border-radius: 30px !important;
            padding: 2px 22px !important;
            margin-bottom: 18px !important;
            background: #ffffff !important;
            transition: all 0.25s ease !important;
        }

        .login-card-new .input-row:focus-within {
            border-color: #1B2C5B !important;
            box-shadow: 0 0 0 3px rgba(27, 44, 91, 0.08) !important;
        }

        .login-card-new .input-row .icon-left {
            color: #9ca3af !important;
            font-size: 14px !important;
            margin-right: 12px !important;
            width: 16px !important;
            text-align: center !important;
            flex-shrink: 0 !important;
        }

        .login-card-new .input-row input {
            flex: 1 !important;
            border: none !important;
            outline: none !important;
            padding: 10px 0 !important;
            font-family: 'Poppins', sans-serif !important;
            font-size: 14px !important;
            color: #374151 !important;
            background: transparent !important;
            width: 100% !important;
            height: auto !important;
            margin: 0 !important;
            box-shadow: none !important;
        }

        .login-card-new .input-row input::placeholder {
            color: #9ca3af !important;
            font-weight: 400 !important;
        }

        /* Override browser autofill background (Chrome/Edge light blue) */
        .login-card-new .input-row input:-webkit-autofill,
        .login-card-new .input-row input:-webkit-autofill:hover,
        .login-card-new .input-row input:-webkit-autofill:focus,
        .login-card-new .input-row input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 1000px #ffffff inset !important;
            box-shadow: 0 0 0 1000px #ffffff inset !important;
            -webkit-text-fill-color: #374151 !important;
            background-color: #ffffff !important;
            transition: background-color 5000s ease-in-out 0s !important;
        }

        .login-card-new .input-row .icon-right {
            color: #9ca3af !important;
            font-size: 14px !important;
            cursor: pointer !important;
            margin-left: 10px !important;
            width: 16px !important;
            text-align: center !important;
            flex-shrink: 0 !important;
            transition: color 0.2s !important;
        }

        .login-card-new .input-row .icon-right:hover {
            color: #4b5563 !important;
        }

        /* Tombol Login */
        .login-card-new .btn-login-new {
            width: 100% !important;
            background: #f94e14 !important;
            color: #ffffff !important;
            border: none !important;
            border-radius: 30px !important;
            padding: 12px 20px !important;
            font-family: 'Poppins', sans-serif !important;
            font-size: 15px !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            margin-top: 12px !important;
            box-shadow: 0 4px 15px rgba(249, 78, 20, 0.3) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            min-width: unset !important;
            height: auto !important;
            line-height: 1.2 !important;
            text-transform: none !important;
            letter-spacing: normal !important;
        }

        .login-card-new .btn-login-new::before {
            display: none !important;
        }

        .login-card-new .btn-login-new:hover {
            background: #e04410 !important;
            color: #ffffff !important;
            transform: translateY(-1px) !important;
            box-shadow: 0 6px 20px rgba(249, 78, 20, 0.4) !important;
        }

        .login-card-new .btn-login-new:active {
            transform: scale(0.98) !important;
        }

        /* Error messages */
        .login-card-new .field-error {
            color: #ef4444 !important;
            font-size: 12px !important;
            margin-top: -12px !important;
            margin-bottom: 14px !important;
            margin-left: 22px !important;
            text-align: left !important;
            display: block !important;
            font-weight: 500 !important;
        }

        .login-card-new .alert-error {
            background-color: #fef2f2 !important;
            color: #dc2626 !important;
            padding: 10px 16px !important;
            border-radius: 8px !important;
            border: 1px solid #fca5a5 !important;
            margin-bottom: 20px !important;
            font-size: 13px !important;
            text-align: center !important;
        }
    </style>
</head>
<body>

    <div class="limiter">
        <div class="container-login100" style="background-image: url('{{ url_for('static', filename='template_login/images/backgroundpos.jpg') }}');">

            <div class="login-card-new">
                {# Dua logo berdampingan #}
                <div class="login-logos">
                    <img src="{{ url_for('static', filename='template_index/assets/images/logo-danatara-black.png') }}" 
                         onerror="this.style.display='none'" 
                         alt="Danantara Indonesia">
                    <img src="{{ url_for('static', filename='template_login/images/logo_pos.png') }}" 
                         onerror="this.style.display='none'" 
                         alt="POS IND">
                </div>

                {# Judul #}
                <h2 class="login-heading">Sistem Prediksi Paket dan<br>Status SLA</h2>

                {# Pesan error umum #}
                {% if error %}
                    <div class="alert-error">
                        <i class="fa fa-exclamation-triangle"></i> {{ error }}
                    </div>
                {% endif %}

                <form method="POST" action="{{ url_for('web.web_login') }}">
                    {# Username #}
                    <div class="input-row">
                        <i class="fa fa-user icon-left"></i>
                        <input name="username" type="text" placeholder="Username" autocomplete="username">
                    </div>

                    {# Password #}
                    <div class="input-row">
                        <i class="fa fa-lock icon-left"></i>
                        <input name="password" id="pwd-field" type="password" placeholder="Password" autocomplete="current-password">
                        <i class="fa fa-eye-slash icon-right" id="pwd-toggle" onclick="togglePwd()"></i>
                    </div>

                    {# Tombol Login #}
                    <button type="submit" class="btn-login-new">Login</button>
                </form>
            </div>

        </div>
    </div>

    <script src="{{ url_for('static', filename='template_login/vendor/jquery/jquery-3.2.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='template_login/vendor/animsition/js/animsition.min.js') }}"></script>
    <script src="{{ url_for('static', filename='template_login/vendor/bootstrap/js/popper.js') }}"></script>
    <script src="{{ url_for('static', filename='template_login/vendor/bootstrap/js/bootstrap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='template_login/vendor/select2/select2.min.js') }}"></script>
    <script src="{{ url_for('static', filename='template_login/vendor/daterangepicker/moment.min.js') }}"></script>
    <script src="{{ url_for('static', filename='template_login/vendor/daterangepicker/daterangepicker.js') }}"></script>
    <script src="{{ url_for('static', filename='template_login/vendor/countdowntime/countdowntime.js') }}"></script>
    <script src="{{ url_for('static', filename='template_login/js/main.js') }}"></script>
    <script>
        function togglePwd() {
            var f = document.getElementById('pwd-field');
            var i = document.getElementById('pwd-toggle');
            if (f.type === 'password') {
                f.type = 'text';
                i.classList.remove('fa-eye-slash');
                i.classList.add('fa-eye');
            } else {
                f.type = 'password';
                i.classList.remove('fa-eye');
                i.classList.add('fa-eye-slash');
            }
        }
    </script>
</body>
</html>
